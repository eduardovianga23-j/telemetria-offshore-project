name: CI - Telemetria Offshore

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Correr testes
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t telemetria-offshore:ci .

      - name: Arrancar o sistema e verificar a API
        run: |
          cp .env.example .env
          docker compose up -d api campo
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/pocos | grep -q B17-A; then
              echo "Telemetria a chegar à API"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Desligar
        if: always()
        run: docker compose down -v
