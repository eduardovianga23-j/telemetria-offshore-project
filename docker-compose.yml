version: '3.8'

services:
  # 🔌 Serviço 1: Backend / API (FastAPI + Simulator + ML)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: telemetria_api
    ports:
      - "8000:8000"
    volumes:
      # Mapeia a base de dados SQLite e os modelos ML para não perder dados ao reiniciar
      - ./telemetria.db:/app/telemetria.db
      - ./app:/app/app
    restart: always

  # 📊 Serviço 2: Frontend / Dashboard (Streamlit)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dash
    container_name: telemetria_dashboard
    ports:
      - "8501:8501"
    environment:
      # Aponta para o nome do serviço 'api' na rede interna do Docker!
      - BASE_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./app:/app/app
    restart: always